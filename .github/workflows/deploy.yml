name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /opt/fabbazaar
          bash scripts/backup.sh
          git fetch origin main
          OLD_HEAD=$(git rev-parse HEAD)
          git reset --hard origin/main
          bash scripts/run-migrations.sh
          docker compose build nextjs
          docker compose up -d --no-deps nextjs
          PIPELINE_CHANGED=$(git diff "$OLD_HEAD" HEAD --name-only -- pipeline/ | wc -l)
          if [ "$PIPELINE_CHANGED" -gt 0 ]; then
            AVAIL_RAM=$(free -m | awk '/^Mem:/{print $7}')
            if [ "$AVAIL_RAM" -ge 600 ]; then
              docker compose build python-pipeline
              docker compose up -d --no-deps python-pipeline
            else
              echo "Skipping python-pipeline rebuild: only ${AVAIL_RAM}MB available (need 600MB)"
            fi
          else
            echo "No pipeline changes, skipping python-pipeline rebuild"
          fi
          docker compose restart caddy
